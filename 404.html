<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | ESCUDO Concursos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1A33">
<!-- Esta página pode ser servida em qualquer endereço do site, por isso não depende de CSS nem de imagens externas. -->
<style>
  :root{--navy:#0B1A33;--gold:#C9A24B;--goldb:#E7C873;--cream:#F5F1E6;--muted:#9DB0CC}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--navy);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;padding:24px 16px}
  main{max-width:520px;width:100%}
  svg{width:64px;height:auto}
  h1{font-family:"Arial Narrow",Arial,sans-serif;font-stretch:condensed;font-weight:900;text-transform:uppercase;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1;margin:18px 0 10px}
  h1 span{color:var(--goldb)}
  p{color:var(--muted);font-size:1.08rem;margin:0 0 22px}
  a{display:block;text-align:center;padding:15px 18px;border-radius:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;margin:0 0 12px}
  .a1{background:linear-gradient(180deg,#E7C873,#C9A24B);color:var(--navy)}
  .a2{border:2px solid var(--gold);color:var(--goldb)}
  a:focus-visible{outline:3px solid var(--goldb);outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 122" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C873"/><stop offset="1" stop-color="#9E7C32"/></linearGradient></defs><path d="M50 4 L92 19 L92 58 C92 90 73 108 50 118 C27 108 8 90 8 58 L8 19 Z" fill="none" stroke="url(#g)" stroke-width="5"/><path d="M50 26 l3.2 6.6 7.3 1 -5.3 5.1 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.3 -5.1 7.3 -1 Z" fill="url(#g)"/><path d="M30 64 L44 80 L73 46" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>Página <span>não encontrada</span></h1>
  <p>O endereço pode ter mudado ou estar digitado errado. Os cursos continuam no mesmo lugar:</p>
  <a class="a1" href="https://escudoconcursos.github.io/pmpe-soldado-2026/" data-abs="pmpe-soldado-2026/">PMPE 2026 Soldado</a>
  <a class="a2" href="https://escudoconcursos.github.io/" data-abs="">Página inicial da ESCUDO</a>
</main>
<script>
  /* No GitHub Pages em subpasta (usuario.github.io/repositorio/), corrige os links para a raiz do repositório.
     Depois de rodar _config/aplicar.py com a url_base, os links já ficam absolutos e isto não muda nada. */
  (function(){
    if (!/\.github\.io$/.test(location.hostname)) return;
    var seg = location.pathname.split("/")[1];
    if (!seg) return;
    document.querySelectorAll("a[data-abs]").forEach(function(a){
      if (a.getAttribute("href").charAt(0) === "/") a.href = "/" + seg + "/" + a.getAttribute("data-abs");
    });
  })();
</script>
</body>
</html>
